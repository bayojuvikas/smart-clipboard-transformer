<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Clipboard Transformer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
<header class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
<h1 class="text-xl font-semibold text-gray-900">Smart Clipboard Transformer</h1>
<p class="text-sm text-gray-500 mt-1">Convert rich-text clipboard data to clean GitHub Flavored Markdown.</p>
</header>

<main class="max-w-4xl mx-auto px-6 py-8">
<section class="space-y-4">
<label for="preview-area" class="sr-only">Transformed markdown preview</label>
<textarea
id="preview-area"
class="w-full min-h-[300px] rounded-lg border border-gray-300 bg-white p-4 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
placeholder="Paste transformed markdown here, or click Format Clipboard to transform your system clipboard."
aria-label="Preview area for transformed markdown"
tabindex="0"
spellcheck="false"></textarea>

<div class="flex flex-col sm:flex-row gap-3">
<button id="btn-format" type="button" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:pointer-events-none" aria-label="Format Clipboard" tabindex="1">
Format Clipboard
</button>
<button id="btn-clear" type="button" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 border border-gray-300 rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition-colors" aria-label="Clear preview" tabindex="2">
Clear
</button>
</div>

<div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none" role="region" aria-live="polite" aria-atomic="true"></div>
</section>
</main>

<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://unpkg.com/turndown@7.1.3/dist/turndown.js"></script>
<script src="https://unpkg.com/turndown-plugin-gfm@1.0.3/dist/turndown-plugin-gfm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prettier@3.2.5/standalone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prettier@3.2.5/parser-markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prettier@3.2.5/parser-babel.js"></script>
<script src="app.js"></script>
</body>
</html>
